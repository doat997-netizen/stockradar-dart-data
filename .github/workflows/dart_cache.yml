name: Stock Radar - DART public filings cache
on:
  workflow_dispatch:
  schedule:
    - cron: '13,43 * * * *'
permissions:
  contents: write
concurrency:
  group: dart-public-cache
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Collect and validate OpenDART official public filings
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          cat > /tmp/sr_dart_collect.py <<'PY_SR84'
          #!/usr/bin/env python3
          """OpenDART /api/list.json -> validated public filing snapshot. Secret stays in Actions.
          
          Only an API status=000 response and a fully fetched page sequence can update the cache.
          The script fails closed on redirects to error pages and leaves prior data untouched.
          """
          from __future__ import annotations
          
          import datetime as dt
          import json
          import os
          import pathlib
          import re
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          
          ROOT = pathlib.Path(__file__).resolve().parents[1]
          OUT = ROOT / 'data' / 'dart_cache.json'
          SOURCE = 'https://opendart.fss.or.kr/api/list.json'
          KST = dt.timezone(dt.timedelta(hours=9))
          RECEPT = re.compile(r'^\d{14}$')
          DATE = re.compile(r'^\d{8}$')
          MAX_ITEMS = 60000
          
          
          def load_previous():
              if not OUT.exists():
                  return None
              try:
                  d = json.loads(OUT.read_text('utf-8'))
                  if d.get('schema') != 'sr-dart-cache-v1' or not isinstance(d.get('items'), list):
                      return None
                  if not isinstance(d.get('covered_days'), list):
                      return None
                  return d
              except (ValueError, OSError):
                  return None
          
          
          def request_page(key: str, start: dt.date, end: dt.date, page: int):
              args = dict(crtfc_key=key, bgn_de=start.strftime('%Y%m%d'), end_de=end.strftime('%Y%m%d'),
                          page_no=str(page), page_count='100', sort='date', sort_mth='desc', last_reprt_at='N')
              url = SOURCE + '?' + urllib.parse.urlencode(args)
              req = urllib.request.Request(url, headers={
                  'Accept': 'application/json', 'User-Agent': 'StockRadar-Public-Disclosure-Collector/1.0',
              })
              # Never emit URL because it includes the API key.
              try:
                  with urllib.request.urlopen(req, timeout=25) as response:
                      final = urllib.parse.urlsplit(response.geturl())
                      if final.scheme != 'https' or final.hostname != 'opendart.fss.or.kr' or final.path != '/api/list.json':
                          raise RuntimeError('DART upstream redirected outside the official API endpoint; snapshot NOT updated')
                      if response.status != 200:
                          raise RuntimeError(f'OpenDART HTTP {response.status}')
                      raw = response.read(2_000_001)
                      if len(raw) > 2_000_000:
                          raise RuntimeError('Unexpectedly large OpenDART response')
              except urllib.error.HTTPError as exc:
                  raise RuntimeError(f'OpenDART HTTP {exc.code}; cache retained') from None
              except urllib.error.URLError:
                  raise RuntimeError('OpenDART request unavailable from collector network; cache retained') from None
              try:
                  data = json.loads(raw)
              except (ValueError, UnicodeError):
                  raise RuntimeError('OpenDART non-JSON response; cache retained') from None
              code = data.get('status')
              if code not in {'000', '013'}:
                  raise RuntimeError(f'OpenDART business status {str(code)[:6]}: {str(data.get("message", ""))[:60]}')
              return data
          
          
          def normalize(x):
              if not isinstance(x, dict):
                  return None
              no, date = str(x.get('rcept_no') or ''), str(x.get('rcept_dt') or '')
              if not RECEPT.fullmatch(no) or not DATE.fullmatch(date):
                  return None
              try:
                  dt.datetime.strptime(date, '%Y%m%d')
              except ValueError:
                  return None
              item = {k: str(x.get(k) or '').strip()[:lim] for k, lim in [
                  ('corp_code', 8), ('corp_name', 150), ('stock_code', 12), ('corp_cls', 1),
                  ('report_nm', 350), ('rcept_no', 14), ('flr_nm', 150), ('rcept_dt', 8), ('rm', 100),
              ]}
              if not item['corp_name'] or not item['report_nm'] or not re.fullmatch(r'[A-Z0-9]{0,12}', item['stock_code'].upper()):
                  return None
              if not re.fullmatch(r'\d{0,8}', item['corp_code']):
                  return None
              return item
          
          
          def fetch_interval(key, start, end):
              first = request_page(key, start, end, 1)
              if first['status'] == '013':
                  return [], 0
              total, pages = int(first.get('total_count', -1)), int(first.get('total_page', -1))
              if total < 0 or pages < 1 or pages > 1000 or total > 100000:
                  raise RuntimeError('OpenDART pagination metadata invalid; cache retained')
              all_items = []
              for p in range(1, pages + 1):
                  data = first if p == 1 else request_page(key, start, end, p)
                  if data.get('status') != '000' or int(data.get('page_no', -1)) != p:
                      raise RuntimeError('OpenDART partial/mismatched page; cache retained')
                  if int(data.get('total_count', -1)) != total:
                      raise RuntimeError('OpenDART result size changed mid-read; cache retained')
                  recs = data.get('list')
                  if not isinstance(recs, list) or len(recs) > 100:
                      raise RuntimeError('OpenDART list content invalid; cache retained')
                  norm = [normalize(x) for x in recs]
                  if any(x is None for x in norm):
                      raise RuntimeError('OpenDART item failed validation; cache retained')
                  all_items.extend(norm)
                  if p < pages:
                      time.sleep(0.12)
              if len({x['rcept_no'] for x in all_items}) != total:
                  raise RuntimeError('OpenDART count mismatch/duplicates; cache retained')
              return all_items, total
          
          
          def daterange(start, end):
              while start <= end:
                  yield start
                  start += dt.timedelta(days=1)
          
          
          def main():
              key = os.environ.get('DART_API_KEY', '').strip()
              if not re.fullmatch(r'[a-zA-Z0-9]{40}', key):
                  raise RuntimeError('DART_API_KEY Actions secret missing or malformed')
              now = dt.datetime.now(KST)
              end = now.date()
              existing = load_previous()
              fetch_days = 30 if not existing or not existing.get('covered_days') else 7
              start = end - dt.timedelta(days=fetch_days - 1)
              print(f'Collecting official DART public listings for {start} through {end}; key not printed')
              staged = {}
              # Fetch <= 3-day slices, so larger periods never risk API 3-month constraint.
              day = start
              seen_count = 0
              while day <= end:
                  last = min(end, day + dt.timedelta(days=2))
                  rows, expected = fetch_interval(key, day, last)
                  for row in rows:
                      staged[row['rcept_no']] = row
                  seen_count += expected
                  print(f'Window {day}..{last}: {expected} records checked')
                  day = last + dt.timedelta(days=1)
                  time.sleep(0.15)
              previous = {}
              covered = set()
              if existing:
                  for row in existing.get('items', []):
                      x = normalize(row)
                      if x:
                          previous[x['rcept_no']] = x
                  covered = set(d for d in existing['covered_days'] if re.fullmatch(r'\d{8}', str(d)))
              # Replace data in successfully queried date windows; retain previous days.
              for no, row in list(previous.items()):
                  if start.strftime('%Y%m%d') <= row['rcept_dt'] <= end.strftime('%Y%m%d'):
                      del previous[no]
              previous.update(staged)
              keep_from = end - dt.timedelta(days=89)
              items = [x for x in previous.values() if x['rcept_dt'] >= keep_from.strftime('%Y%m%d')]
              if len(items) > MAX_ITEMS:
                  raise RuntimeError('Data exceeds bounded cache; retained last known good snapshot')
              items.sort(key=lambda x: (x['rcept_dt'], x['rcept_no']), reverse=True)
              covered.update(day.strftime('%Y%m%d') for day in daterange(start, end))
              covered = sorted(x for x in covered if x >= keep_from.strftime('%Y%m%d') and x <= end.strftime('%Y%m%d'))
              data = {
                  'schema': 'sr-dart-cache-v1', 'source': 'OpenDART /api/list.json',
                  'updated_at': now.isoformat(), 'timezone': 'Asia/Seoul',
                  'covered_days': covered, 'count': len(items), 'items': items,
                  'note': 'Verified complete API pagination for each covered day at collection time. Not live; current-day filings may change after collection.',
              }
              OUT.parent.mkdir(parents=True, exist_ok=True)
              temp = OUT.with_suffix('.tmp')
              temp.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')
              temp.replace(OUT)
              print(f'Wrote snapshot: {len(items)} distinct receipts, {len(covered)} dated coverage markers; key never published')
          
          
          if __name__ == '__main__':
              try:
                  main()
              except Exception as exc:
                  print('ERROR:', str(exc), file=sys.stderr)
                  sys.exit(1)
          PY_SR84
          mkdir -p src
          # script locates repo root as parent of temporary src file
          cp /tmp/sr_dart_collect.py src/collect_dart.py
          python3 src/collect_dart.py
      - name: Publish complete snapshot only if changed
        run: |
          git config user.name 'stock-radar-data-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/dart_cache.json
          if git diff --cached --quiet; then
            echo 'No changes in snapshot'
            exit 0
          fi
          git commit -m 'Refresh DART public filings cache'
          git push
