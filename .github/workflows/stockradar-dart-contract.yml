name: StockRadar DART public-cache contract
on:
  push:
    paths:
      - 'data/dart_cache.json'
      - 'qa/check_dart_contract.py'
      - '.github/workflows/stockradar-dart-contract.yml'
  schedule:
    - cron: '15 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate public DART cache
        run: python qa/check_dart_contract.py data/dart_cache.json > stockradar-dart-qa.json
      - name: Archive result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stockradar-dart-qa
          path: stockradar-dart-qa.json
          if-no-files-found: warn
